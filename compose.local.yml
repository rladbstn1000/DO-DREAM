name: dodream-phase1
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?run local init}
      MYSQL_USER: ${MYSQL_USER:?run local init}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run local init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run local init}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
    cpus: 1.0
    mem_limit: 768m
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.5
    mem_limit: 128m
  be:
    build:
      context: ./be
      dockerfile: Dockerfile.local
    environment: &be-env
      SPRING_PROFILES_ACTIVE: local
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET_BASE64}
      JWT_ISSUER: dodream
      JWT_AUDIENCE: dodream-api
      JWT_CLOCK_SKEW_SECONDS: '5'
      AI_BASE_URL: http://ai:8000
      LOCAL_TEACHER_PASSWORD: ${LOCAL_TEACHER_PASSWORD}
      LOCAL_STUDENT_SECRET: ${LOCAL_STUDENT_SECRET}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      - be-data:/app/local-data
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 30
    cpus: 2.0
    mem_limit: 1024m
  be-test:
    profiles: [test]
    build:
      context: ./be
      dockerfile: Dockerfile.local
      target: test
    command:
      - sh
      - -c
      - 'gradle --no-daemon --offline test --rerun-tasks; result=$$?; for report in build/test-results/test/TEST-*.xml; do sed -n "2p" "$$report"; done; exit $$result'
    environment: *be-env
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    cpus: 2.0
    mem_limit: 1280m
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.local
    environment: &ai-env
      APP_ENV: local
      LOCAL_EXTERNAL_STUBS: 'true'
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      JWT_ISSUER: dodream
      JWT_AUDIENCE: dodream-api
      JWT_CLOCK_SKEW_SECONDS: '5'
      CELERY_BROKER_URL: redis://redis:6379/1
      RAG_DATABASE_URL: sqlite:////app/db_data/rag.db
      LOCAL_PROVIDER_DATA_DIR: /app/db_data/local_provider
    volumes:
      - ai-data:/app/db_data
    depends_on:
      be: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 1.0
    mem_limit: 512m
  worker:
    build:
      context: ./ai
      dockerfile: Dockerfile.local
    environment: *ai-env
    command: [celery, -A, app.celery_config.celery_app, worker, --loglevel=warning, --concurrency=1, --pool=solo]
    volumes:
      - ai-data:/app/db_data
    depends_on:
      ai: {condition: service_healthy}
    cpus: 1.0
    mem_limit: 384m
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile.local
    environment:
      APP_ENV: local
      LOCAL_EXTERNAL_STUBS: 'true'
      ENVIRONMENT: local
      DEBUG: 'false'
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 1.0
    mem_limit: 384m
  web:
    build:
      context: ./fe-web
      dockerfile: Dockerfile.local
    ports:
      - '127.0.0.1:${WEB_PORT}:80'
      - '127.0.0.1:${BE_PORT}:8080'
      - '127.0.0.1:${AI_PORT}:8000'
      - '127.0.0.1:${PDF_PORT}:8001'
    networks: [default, gateway]
    depends_on:
      be: {condition: service_healthy}
      ai: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 128m
  be-auth-short:
    profiles: [auth-test]
    image: dodream-phase1-be
    environment:
      <<: *be-env
      JWT_ACCESS_EXP_SECONDS: '2'
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    cpus: 2.0
    mem_limit: 1024m
  web-auth-test:
    profiles: [auth-test]
    image: dodream-phase1-web
    volumes:
      - ./scripts/local/nginx.auth-test.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:15174:80'
    networks: [default, gateway]
    depends_on:
      be-auth-short: {condition: service_healthy}
      ai: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 128m

networks:
  gateway:
  default:
    internal: true
volumes:
  mysql-data:
  redis-data:
  be-data:
  ai-data:
