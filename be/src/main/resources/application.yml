management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator

  endpoint:
    health:
      show-details: never
      show-components: never

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: monitoring

    # 👇 enable 은 distribution 안이 아니라 metrics 바로 아래
    enable:
      jvm: true
      hikaricp: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: DODREAM

  cloud:
    vault:
      token: ${vaultToken}
      kv:
        enabled: true
        backend: secret

      uri: ${vaultAddr}
  config:
    activate:
      on-profile: "!local"
    import: vault://

  datasource:
    url: ${jdbc-url}
    username: ${username}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # File Upload Settings
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  data:
    redis:
      port: 6379

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        same-site: lax
  tomcat:
    connection-timeout: 15s  # Also bounds idle request-body reads (Tomcat disableUploadTimeout=true default).
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# File Storage Configuration
file:
  upload:
    dir: ${user.home}/dodream/uploads
    temp-dir: ${user.home}/dodream/temp

# Naver Clova OCR Configuration
clova:
  ocr:
    api-url: ${CLOVA_API_URL}
    secret-key: ${CLOVA_SECRET_KEY}

jwt:
  secret: ${jwtSecret}
  access-exp-seconds: 900
  refresh-exp-seconds: 1209600

aws:
  s3:
    bucket: ${awsS3Bucket}
    region: ${awsRegion}
    upload-prefix: pdf
    presign-exp-minutes: 5
  cloudfront:
    domain: ${cloudFrontDomain}
    key-pair-id: ${cloudFrontKeyId}
    private-key-pem: ${privateKeyPem}

springdoc:
  api-docs:
    enabled: false
    path: /api/v3/api-docs
  swagger-ui:
    enabled: false
    path: /api/swagger-ui
    url: /api/v3/api-docs      # 스펙 JSON은 이걸로 불러라
    config-url: /api/v3/api-docs/swagger-config

fastapi:
  url: ${fast_api_url}
